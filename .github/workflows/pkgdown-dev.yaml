# Builds the DEVELOPMENT website: https://giottosuite.com/dev/
#
# The build lives in giotto-suite/.github and is shared across the org. This
# file says which site this is and which refs it documents.
#
# WHICH PACKAGES DOES THIS DOCUMENT?
# package-ref plus the `pins` below -- currently the gsource line, which is
# ahead of the release branches and slated to become the next `dev`. When that
# merge happens and gsource is retired, change those refs to dev.
#
# WHY THE SIBLINGS ARE PINNED
# Giotto@gsource and GiottoVisuals@gsource declare a BARE
# giotto-suite/GiottoClass in Remotes:, which resolves to that repo's default
# branch -- main, v0.5.1. gsource needs v0.6.0. Left alone, the build installs
# the wrong GiottoClass, succeeds, and silently documents gsource's code
# against release-era classes.
#
# Pinning inside a DESCRIPTION does not work (two repos declare the same
# package, one pinned and one not, and pak rejects the conflict), and stripping
# Remotes: does not either (the Giotto packages are on no repository, so pak
# then cannot find them at all). So: let pak resolve normally, then overlay the
# pins with dependency resolution switched off.
#
# Order matters: dependency order, each pin after everything it imports. With
# dependencies = FALSE a pin never pulls in a sibling, so nothing can undo an
# earlier one -- but it is built against whatever is installed at that moment.
# GiottoVisuals@gsource needs GiottoClass >= 0.7.2, so installed before the
# GiottoClass pin it failed and R silently restored the release version. Giotto
# itself is installed after all of them by the shared workflow.

name: pkgdown (dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      package-ref:
        description: "Branch/tag of giotto-suite/Giotto to document"
        default: gsource
        required: false

jobs:
  # Structure check -- registration, navbar links, section anchors, figure
  # paths. Runs in seconds and installs nothing but yaml, so a mistake that
  # would otherwise surface an hour into the build is reported before the
  # build starts. A caller job that uses a reusable workflow cannot have its
  # own steps:, which is why this is a separate job the site job gates on.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install yaml
        run: install.packages("yaml")
        shell: Rscript {0}
      # Only DESCRIPTION and man/ of the documented package: enough for
      # check-site.R to verify every topic is listed under `reference:`, which
      # otherwise surfaces as "N topics missing from index" deep into the build.
      - name: Check out the documented package's Rd files
        uses: actions/checkout@v4
        with:
          repository: giotto-suite/Giotto
          ref: ${{ inputs.package-ref || 'gsource' }}
          path: pkgsrc
          sparse-checkout: |
            DESCRIPTION
            man
          sparse-checkout-cone-mode: false
      - name: Check site structure
        run: Rscript pkgdown/check-site.R --pkg pkgsrc

  site:
    needs: check
    permissions:
      contents: write
    uses: giotto-suite/.github/.github/workflows/pkgdown-site.yaml@main
    with:
      mode: dev
      package-repo: giotto-suite/Giotto
      package-ref: ${{ inputs.package-ref || 'gsource' }}
      overlay-files: "_pkgdown.yml index.md"
      dependencies: '"hard"'
      # local::. deliberately absent: Giotto@gsource cannot install against the
      # GiottoClass pak resolves here, so the shared workflow installs it after
      # the pins.
      extra-packages: >
        github::giotto-suite/GiottoData, any::pkgdown,
        any::kableExtra, any::ggspavis, any::pheatmap, any::scater,
        any::STexampleData, any::scran, any::ComplexHeatmap
      pins: |
        giotto-suite/GiottoUtils@main
        giotto-suite/GiottoClass@gsource
        giotto-suite/GiottoVisuals@gsource
      # Floors, not exact versions: the failure being guarded against is main
      # (GiottoClass 0.5.1, GiottoVisuals 0.2.15) or suite (Giotto 4.2.3)
      # displacing the pins, and an exact version failed every time gsource
      # bumped its own.
      expect-versions: "GiottoClass>=0.6.0,GiottoVisuals>=0.2.16,Giotto>=4.2.4"
