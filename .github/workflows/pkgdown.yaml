# Builds the RELEASE website: https://giottosuite.com
#
# The build lives in giotto-suite/.github and is shared across the org. This
# file says which site this is; the dev counterpart is pkgdown-dev.yaml, which
# publishes the gsource line to /dev/.
#
# WHICH PACKAGE DOES THIS DOCUMENT?
# package-ref below. This repository owns the website content -- vignettes,
# _pkgdown.yml, theme, landing page -- while the package source is checked out
# at build time, so there is no package mirror here to keep in sync.
#
# Rd examples stay ON for the release build, unlike dev. They add roughly an
# hour, but turning them off changes what the released site publishes.

name: pkgdown

on:
  push:
    branches: [suite]
  pull_request:
    branches: [suite]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package-ref:
        description: "Branch/tag of giotto-suite/Giotto to document"
        default: suite
        required: false

jobs:
  site:
    permissions:
      contents: write
    uses: giotto-suite/.github/.github/workflows/pkgdown-site.yaml@main
    with:
      mode: release
      package-repo: giotto-suite/Giotto
      package-ref: ${{ inputs.package-ref || 'suite' }}
      overlay-files: "_pkgdown.yml index.md"
      dependencies: '"hard"'
      # local::. deliberately absent: the shared workflow installs the
      # documented package itself, after any pinning. Listing it here would
      # install Giotto twice.
      extra-packages: >
        github::giotto-suite/GiottoData, any::pkgdown,
        any::kableExtra, any::ggspavis, any::pheatmap, any::scater,
        any::STexampleData, any::scran, any::ComplexHeatmap
