# Builds the RELEASE website: https://giottosuite.com
#
# The build lives in giotto-suite/.github and is shared across the org. This
# file says which site this is; the dev counterpart is pkgdown-dev.yaml, which
# publishes the gsource line to /dev/.
#
# WHICH PACKAGE DOES THIS DOCUMENT?
# package-ref below. This repository owns the website content -- vignettes,
# _pkgdown.yml, theme, landing page -- while the package source is checked out
# at build time, so there is no package mirror here to keep in sync.
#
# Rd examples stay ON for the release build, unlike dev. They add roughly an
# hour, but turning them off changes what the released site publishes.

name: pkgdown

on:
  push:
    branches: [suite]
  pull_request:
    branches: [suite]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package-ref:
        description: "Branch/tag of giotto-suite/Giotto to document"
        default: suite
        required: false

jobs:
  # Structure check -- registration, navbar links, section anchors, figure
  # paths. Runs in seconds and installs nothing but yaml, so a mistake that
  # would otherwise surface an hour into the build is reported before the
  # build starts. A caller job that uses a reusable workflow cannot have its
  # own steps:, which is why this is a separate job the site job gates on.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install yaml
        run: install.packages("yaml")
        shell: Rscript {0}
      # Only DESCRIPTION and man/ of the documented package: enough for
      # check-site.R to verify every topic is listed under `reference:`, which
      # otherwise surfaces as "N topics missing from index" deep into the build.
      - name: Check out the documented package's Rd files
        uses: actions/checkout@v4
        with:
          repository: giotto-suite/Giotto
          ref: ${{ inputs.package-ref || 'suite' }}
          path: pkgsrc
          sparse-checkout: |
            DESCRIPTION
            man
          sparse-checkout-cone-mode: false
      - name: Check site structure
        run: Rscript pkgdown/check-site.R --pkg pkgsrc

  site:
    needs: check
    permissions:
      contents: write
    uses: giotto-suite/.github/.github/workflows/pkgdown-site.yaml@main
    with:
      mode: release
      package-repo: giotto-suite/Giotto
      package-ref: ${{ inputs.package-ref || 'suite' }}
      overlay-files: "_pkgdown.yml index.md"
      dependencies: '"hard"'
      # local::. deliberately absent: the shared workflow installs the
      # documented package itself, after any pinning. Listing it here would
      # install Giotto twice.
      extra-packages: >
        github::giotto-suite/GiottoData, any::pkgdown,
        any::kableExtra, any::ggspavis, any::pheatmap, any::scater,
        any::STexampleData, any::scran, any::ComplexHeatmap
