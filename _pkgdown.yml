template:
  includes:
    in_header: |
       <!-- Global site tag (gtag.js) - Google Analytics -->
       <script async src="https://www.googletagmanager.com/gtag/js?id=G-2V1K0KPLJC"></script>
       <script>
         window.dataLayer = window.dataLayer || [];
         function gtag(){dataLayer.push(arguments);}
         gtag('js', new Date());

         gtag('config', 'G-2V1K0KPLJC');
       </script>
  bootstrap: 5
  bootswatch: cosmo
  theme: arrow-light
  # REQUIRED. The default (`mathml`) relies on pandoc, but Rd math from
  # \deqn{}/\eqn{} never passes through pandoc, so 12 reference pages would
  # print raw LaTeX. Bootstrap 3 got away with it by always loading MathJax;
  # Bootstrap 5 only emits a renderer when asked.
  math-rendering: katex
  bslib:
    # These layer on top of the bootswatch preset. Note bg/fg were dropped:
    # they were dead config under Bootstrap 3 and cosmo supplies its own.
    primary: "#7E69AE"
    # Bootswatch names a font but ships no webfont; without these it silently
    # falls back to the system stack. font_google() bundles at build time, so
    # there is still no runtime CDN request.
    base_font: {google: "Source Sans Pro"}
    heading_font: {google: "Source Sans Pro"}
    code_font: {google: "JetBrains Mono"}


development:
  # Explicit, not `auto`. The package version is the same on the release and
  # development sources, so version-based detection cannot tell them apart --
  # and with `auto` a stray .9000 version reaching this branch would silently
  # relocate the entire production site into /dev/.
  # The dev site is produced by forcing PKGDOWN_DEV_MODE=devel in its workflow,
  # which overrides this value.
  mode: release

